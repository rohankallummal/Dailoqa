services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dailoqa
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dailoqa"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/dailoqa
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["./worker-entrypoint.sh"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/dailoqa
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
