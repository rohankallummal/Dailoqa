services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      EVIDENCE_ROOT: /evidence
    ports:
      - "8000:8000"
    volumes:
      - ../Frontend/tmp:/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    restart: unless-stopped
    command: ["./worker-entrypoint.sh"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      EVIDENCE_ROOT: /evidence
    volumes:
      - ../Frontend/tmp:/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
